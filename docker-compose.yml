name: cellstock

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/cellstock:${APP_VERSION:-1.0.0}
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000"          # http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - cellstock-net
    restart: unless-stopped

  db:
    image: postgres:16.4-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data                      # named volume = persistent data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # runs only on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - cellstock-net                      # no ports published: reachable only inside the network
    restart: unless-stopped

  cache:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cellstock-net
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    profiles: ["tools"]                    # only starts with: docker compose --profile tools up -d
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cellstock-net

networks:
  cellstock-net:
    driver: bridge

volumes:
  pgdata:
